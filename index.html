    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: '#FFFEFA', /* Crisper White */
              gold: {
                50: '#F9F5EB',
                100: '#F0EAD6',
                200: '#E6D7B0',
                300: '#D4C38E',
                400: '#C5A059', /* Metallic Antique Gold */

                800: '#4A381A',

                300: '#9AA5B1',
                400: '#7B8794',

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
        background-color: #FFFEFA;
      }
      
      body {
        background-color: #FFFEFA;
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
        color: #1F2933;
      }

      h1, h2, h3, h4, .font-serif {
        font-family: 'Cormorant Garamond', serif;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #FFFEFA; 
      }
      ::-webkit-scrollbar-thumb {
        background: #D4C38E; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C5A059; 
      }
    </style>
